# Merge into the existing CPA config. Keep the rest of the configuration.
# Compiled Linux amd64 artifact: dist/quota-guard.so
plugins:
  enabled: true
  dir: /opt/cliproxyapi/plugins
  configs:
    quota-guard:
      enabled: true
      priority: 100
      state_dir: /var/lib/cliproxyapi/quota-guard
      proxy_url: ""  # Empty means direct; the installer inherits CPA requests.proxy-url.
      management_url: "http://127.0.0.1:8317"  # Same CPA API used by CPAMC's manual reset.
      management_key_file: /var/lib/cliproxyapi/quota-guard/cpa-management.key  # 0600, service user owned.

      # Optional: service-owned 0600 file containing an HTTP(S) webhook URL.
      # Omit to disable notifications; URL is never returned by the status API.
      notification_webhook_file: ""
